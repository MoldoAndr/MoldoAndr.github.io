<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Demo - Vitruvian Cipher</title>
    <meta name="description" content="Explore the Vitruvian Cipher React interface">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000000;
        }

        /* Canvas Background */
        #fluid-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.6;
        }

        .demo-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 255, 136, 0.2);
            padding: 0.75rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .demo-nav .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #00ff88;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.05em;
        }

        .demo-nav .logo:hover {
            color: #00dd77;
        }

        .demo-nav .links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .demo-nav a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .demo-nav a:hover {
            color: #00ff88;
        }

        .demo-nav .btn {
            padding: 0.5rem 1.25rem;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 8px;
            color: #00ff88;
        }

        .demo-nav .btn:hover {
            background: rgba(0, 255, 136, 0.2);
        }

        .demo-info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 12px;
            padding: 1rem 2rem;
            text-align: center;
            max-width: 600px;
        }

        .demo-info h3 {
            color: #00ff88;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .demo-info p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.875rem;
        }

        .demo-info a {
            color: #00ff88;
            text-decoration: none;
            font-weight: 500;
        }

        .demo-info a:hover {
            text-decoration: underline;
        }

        .demo-frame {
            position: fixed;
            top: 60px;
            left: 0;
            width: 100%;
            height: calc(100% - 60px);
            border: none;
            z-index: 1;
            background: transparent;
        }

        @media (max-width: 768px) {
            .demo-nav {
                padding: 1rem;
            }

            .demo-nav .links {
                gap: 1rem;
            }

            .demo-nav .links span:not(.btn) {
                display: none;
            }

            .demo-info {
                left: 10px;
                right: 10px;
                transform: none;
                bottom: 10px;
            }

            .demo-frame {
                padding-top: 56px;
            }
        }
    </style>
</head>
<body>
    <canvas id="fluid-canvas"></canvas>

    <nav class="demo-nav">
        <a href="index.html" class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            vitruvian-cipher
        </a>
        <div class="links">
            <a href="index.html">Home</a>
            <a href="documentation.html">Documentation</a>
            <a href="https://github.com/MoldoAndr/vitruvian-cipher" target="_blank" class="btn">GitHub</a>
        </div>
    </nav>

    <iframe src ="demo-interface/index.html" class="demo-frame"></iframe>

    <script src="js/webgl-fluid.js"></script>
</body>
</html>
